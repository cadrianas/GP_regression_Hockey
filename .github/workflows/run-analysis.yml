name: Run analysis

on:
  workflow_dispatch:
    inputs:
      evaluation_season:
        description: 'First year of evaluation season (2025 means 2025–26)'
        required: true
        default: '2024'
      train_start:
        description: 'First training season'
        required: true
        default: '2014'
      recent_start:
        description: 'First season in the recent training group'
        required: true
        default: '2022'
      train_end:
        description: 'Last training season; must precede evaluation'
        required: true
        default: '2023'
      evaluation_status:
        description: 'Completeness is your declaration, not verified by the downloader'
        type: choice
        options: [snapshot, season-to-date, complete]
        default: snapshot
      refresh_evaluation:
        description: 'Download a fresh evaluation file (always done for season-to-date)'
        type: boolean
        default: true
      sensitivities:
        description: 'Include manpower, era-boundary, and noise checks'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/hockey-mpl
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Restore downloaded seasons
        uses: actions/cache@v4
        with:
          path: |
            Data/shots_*.csv
            Data/shots_*.json
          key: moneypuck-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: moneypuck-v1-${{ runner.os }}-
      - name: Download and analyze
        env:
          EVALUATION: ${{ inputs.evaluation_season }}
          TRAIN_START: ${{ inputs.train_start }}
          RECENT_START: ${{ inputs.recent_start }}
          TRAIN_END: ${{ inputs.train_end }}
          EVALUATION_STATUS: ${{ inputs.evaluation_status }}
          REFRESH: ${{ inputs.refresh_evaluation }}
          SENSITIVITIES: ${{ inputs.sensitivities }}
        shell: bash
        run: |
          args=(--data-dir Data --output-dir runs/current
                --train-start "$TRAIN_START" --recent-start "$RECENT_START"
                --train-end "$TRAIN_END" --evaluation-season "$EVALUATION"
                --evaluation-status "$EVALUATION_STATUS")
          if [[ "$REFRESH" == "true" ]]; then args+=(--refresh-evaluation); fi
          if [[ "$SENSITIVITIES" == "true" ]]; then args+=(--sensitivities); fi
          python -m src.pipeline "${args[@]}"
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [[ -f runs/current/summary.md ]]; then
            # Images and relative links can be opened in the downloadable report.
            sed '/^!\[/d' runs/current/summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f runs/current/manifest.json ]]; then
            printf 'Analysis did not complete. See the logs and manifest in the artifact.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save results and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hockey-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/current/
          if-no-files-found: warn
          retention-days: 30
